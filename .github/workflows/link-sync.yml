name: Experimental Virtual Link Cable
on:
  pull_request:
    paths: ['sync/**', 'tests/**', 'src/sender.cpp', 'src/pcm_timeline.h', 'src/tempo_hold.h', 'src/core_probe.cpp', 'src/settings.cpp', 'src/ui_font.h', 'tools/make_ui_assets.py', 'CMakeLists.txt', 'tools/*sync*', 'tools/*mgba*', 'tools/build_probe.py', 'tools/prepare_link.py', 'tools/package_virtual_cable.py', 'Apps/LINK4BRICK/**', 'docs/VIRTUAL_LINK_CABLE.md', '.github/workflows/link-sync.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate verified menu font assets
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pil
          python3 tools/make_ui_assets.py
      - name: Validate clock grid and input data
        run: |
          cc -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Werror tests/clock_test.c -lm -o clock-test
          ./clock-test
          c++ -std=c++17 -Wall -Wextra -Werror tests/pcm_timeline_test.cpp -o pcm-timeline-test
          ./pcm-timeline-test
          c++ -std=c++17 -Wall -Wextra -Werror tests/tempo_hold_test.cpp -o tempo-hold-test
          ./tempo-hold-test
          for script in Apps/LINK4BRICK/*.sh Apps/LINK4BRICK/cable/*.sh; do sh -n "$script"; done
          python3 tests/virtual_cable_launcher_test.py
      - name: Test the real sender clock bridge with a second Link participant
        run: |
          git clone https://github.com/Ableton/link.git link
          git -C link checkout 902aef95bf94af49746fdda5369b42cdcfa1e6d2
          git -C link submodule update --init --recursive
          python3 tools/prepare_link.py link
          cmake -S . -B host-build -DLINK_DIR="$PWD/link" -DAUDIOCAST_CLOCK_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build host-build -j2
          python3 tests/settings_test.py host-build
          python3 tests/clock_only_test.py host-build
          python3 tests/sender_clock_test.py host-build
          python3 tests/sender_clock_test.py host-build --tempo-hold
          python3 tests/sender_clock_test.py host-build --tempo-latch
          python3 tests/sender_audio_test.py host-build
          python3 tests/sender_audio_test.py host-build --tempo-latch
      - name: Build pinned mGBA and private probe (no ROM included)
        run: |
          python3 tools/prepare_mgba.py mgba
          cmake -S mgba -B mgba-build -C sync/mgba-options.cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build mgba-build -j2
          python3 tools/build_probe.py mgba-build
          python3 tools/build_probe.py mgba-build --synthetic --output core-clock-test
          ./core-clock-test
          python3 tools/build_probe.py mgba-build --serial --output serial-clock-test
          ./serial-clock-test
          python3 tools/build_probe.py mgba-build --stepper --output stepper-clock-test
          timeout 60 ./stepper-clock-test
          python3 tools/build_probe.py mgba-build --gb --output gb-clock-test
          ./gb-clock-test
          python3 tools/build_probe.py mgba-build --audio --output audio-rate-test
          ./audio-rate-test
          cc -std=gnu11 -D_POSIX_C_SOURCE=200809L -I mgba/src/platform/libretro tests/libretro_lifecycle.c -ldl -o libretro-lifecycle
          ./host-build/audiocast-core-probe mgba-build/mgba_libretro.so
          ./libretro-lifecycle mgba-build/mgba_libretro.so
          ./libretro-lifecycle mgba-build/mgba_libretro.so --gb
  build:
    needs: host
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/loveretro/tg5040-toolchain:latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned sources
        run: |
          git clone https://github.com/Ableton/link.git link
          git -C link checkout 902aef95bf94af49746fdda5369b42cdcfa1e6d2
          git -C link submodule update --init --recursive
          python3 tools/prepare_link.py link
          python3 tools/prepare_mgba.py mgba
      - name: Generate verified menu font assets
        run: |
          apt-get update && apt-get install -y python3-pil
          python3 tools/make_ui_assets.py
      - name: Build ARM64 sender and isolated core
        run: |
          cmake -S . -B build -DLINK_DIR="$PWD/link" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=/opt/aarch64-nextui-linux-gnu/bin/aarch64-nextui-linux-gnu-g++
          cmake --build build -j2
          cmake -S mgba -B mgba-build -C sync/mgba-options.cmake \
            -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=/opt/aarch64-nextui-linux-gnu/bin/aarch64-nextui-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=/opt/aarch64-nextui-linux-gnu/bin/aarch64-nextui-linux-gnu-g++
          cmake --build mgba-build -j2
      - name: Test ARM64 loading and actual libretro execution on Cortex-A53
        run: |
          apt-get update && apt-get install -y qemu-user
          /opt/aarch64-nextui-linux-gnu/bin/aarch64-nextui-linux-gnu-gcc \
            -std=gnu11 -D_POSIX_C_SOURCE=200809L -I mgba/src/platform/libretro \
            tests/libretro_lifecycle.c -ldl -o build/libretro-lifecycle
          AC_SDK_SYSROOT=$(/opt/aarch64-nextui-linux-gnu/bin/aarch64-nextui-linux-gnu-gcc -print-sysroot)
          (cd Apps/LINK4BRICK && qemu-aarch64 -cpu cortex-a53 -L "$AC_SDK_SYSROOT" ../../build/audiocast-settings --render /tmp/link4brick-menu.ppm)
          python3 -c 'from pathlib import Path; assert Path("/tmp/link4brick-menu.ppm").read_bytes().startswith(b"P6\n1024 768\n")'
          qemu-aarch64 -cpu cortex-a53 -L "$AC_SDK_SYSROOT" build/audiocast-core-probe mgba-build/mgba_libretro.so
          qemu-aarch64 -cpu cortex-a53 -L "$AC_SDK_SYSROOT" build/libretro-lifecycle mgba-build/mgba_libretro.so
          qemu-aarch64 -cpu cortex-a53 -L "$AC_SDK_SYSROOT" build/libretro-lifecycle mgba-build/mgba_libretro.so --gb
      - name: Package and validate experimental StockUI ZIP
        run: |
          apt-get update && apt-get install -y python3-pil zip unzip
          python3 tools/package_virtual_cable.py --build build --core mgba-build/mgba_libretro.so \
            --link link --output dist/LINK4BRICK-StockUI-preview.zip
          unzip -t dist/LINK4BRICK-StockUI-preview.zip
          mkdir -p source
          git -c safe.directory="$PWD" archive HEAD | tar -x -C source
          cp -a link mgba assets source/
          cp -a Apps/LINK4BRICK/ui source/Apps/LINK4BRICK/
          cp src/ui_font.h source/src/ui_font.h
          find source -name .git -prune -exec rm -rf {} +
          # Upstream emulator test fixtures are not needed to rebuild this core.
          rm -rf source/mgba/cinema
          python3 - <<'PYTHON'
          from pathlib import Path
          forbidden = {'.gb', '.gba', '.sav', '.srm', '.log', '.pak'}
          assert not any(p.suffix.lower() in forbidden for p in Path('source').rglob('*') if p.is_file())
          PYTHON
          tar -czf dist/LINK4BRICK-source.tar.gz -C source .
          cd dist
          sha256sum LINK4BRICK-StockUI-preview.zip LINK4BRICK-source.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: STOCKUI-ONLY--Virtual-Link-Cable-EXPERIMENTAL
          path: dist/
          if-no-files-found: error
